[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltstream-gatekeeper"
version = "0.1.0"
description = "Evidence-first intake gatekeeper for heterogeneous EV charger records"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
voltstream = "voltstream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
